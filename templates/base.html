<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demeter — {% block title %}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app-shell">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 34C20 34 8 27.5 8 17.5C8 11 13 6 19 6C19.5 6 20 6.05 20 6.05C20 6.05 20.5 6 21 6C27 6 32 11 32 17.5C32 27.5 20 34 20 34Z" fill="#4A6B3A"/>
        <path d="M20 34C20 34 20 22 20 6" stroke="#1F2E1C" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M20 14C20 14 16 15 15 19" stroke="#1F2E1C" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M20 20C20 20 24.5 21 25.5 25" stroke="#1F2E1C" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Demeter</span>
        <span class="brand-tag">offline &amp; grounded</span>
      </div>
    </div>

    <div class="sidebar-links">
      <a href="/" class="nav-link {% if active == 'home' %}active{% endif %}">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 11L12 4L21 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10V20H19V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>Home</span>
      </a>
      <a href="/chat" class="nav-link {% if active == 'chat' %}active{% endif %}">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 5H20V16H8L4 20V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </span>
        <span>Ask Demeter</span>
      </a>
      <a href="/profile" class="nav-link {% if active == 'profile' %}active{% endif %}">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20C5.5 15.8 8.4 14 12 14C15.6 14 18.5 15.8 19.5 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span>Profile</span>
      </a>
      <a href="/settings" class="nav-link {% if active == 'settings' %}active{% endif %}">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5C19.5 13 19.5 12.5 19.5 12C19.5 11.5 19.5 11 19.4 10.5L21.4 8.9L19.9 6.3L17.5 7.2C16.8 6.6 15.9 6.1 15 5.8L14.6 3.3H11.4L11 5.8C10.1 6.1 9.2 6.6 8.5 7.2L6.1 6.3L4.6 8.9L6.6 10.5C6.5 11 6.5 11.5 6.5 12C6.5 12.5 6.5 13 6.6 13.5L4.6 15.1L6.1 17.7L8.5 16.8C9.2 17.4 10.1 17.9 11 18.2L11.4 20.7H14.6L15 18.2C15.9 17.9 16.8 17.4 17.5 16.8L19.9 17.7L21.4 15.1L19.4 13.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </span>
        <span>Settings</span>
      </a>
    </div>

    <div class="sidebar-status">
      <span class="status-dot" id="ollama-status-dot"></span>
      <span id="ollama-status-text">Checking engine…</span>
    </div>
  </nav>

  <!-- Main content -->
  <main class="main-panel">
    {% block content %}{% endblock %}
  </main>

</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
